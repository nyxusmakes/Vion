name: Build Vion Unsigned IPA

on:
  workflow_dispatch

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode Project with CMake
        run: |
          cmake --preset macos-xcode

      - name: Build App Package
        run: |
          cmake --build build/macos-xcode --config Release

      - name: Structure Bundle Payload
        shell: bash
        run: |
          mkdir -p build/ios/iphoneos/Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find any .app bundle under build/"
            exit 1
          fi
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/

      - name: Package Payload into IPA File
        run: |
          cd build/ios/iphoneos
          zip -r Vion_Unsigned.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-Unsigned-IPA
          path: build/ios/iphoneos/Vion_Unsigned.ipa
          retention-days: 5
