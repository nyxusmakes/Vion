name: Build Vion Unsigned IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually from the browser

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest # Uses GitHub's cloud Mac servers for compilation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Clean and Build App Package
        run: |
          # 1. Clean the environment
          xcodebuild clean -project Vion.xcodeproj -scheme Vion
          
          # 2. Build for a generic iOS device without needing official Apple cert signing
          xcodebuild build -project Vion.xcodeproj \
            -scheme Vion \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Structure Bundle Payload
        run: |
          # 3. Create the standard iOS Payload folder format for IPAs
          mkdir -p build/ios/iphoneos/Payload
          
          # Find the compiled .app file and move it into the Payload container
          APP_PATH=$(find build/ -name "Vion.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Vion.app" -type d | head -n 1)
          fi
          
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/

      - name: Package Payload into IPA File
        working-directory: build/ios/iphoneos
        run: |
          # 4. Compress the Payload directory into a valid .ipa file
          zip -r Vion_Unsigned.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-Unsigned-IPA
          path: build/ios/iphoneos/Vion_Unsigned.ipa
          retention-days: 5
